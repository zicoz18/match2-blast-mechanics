<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Match2Blast</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1d21; }
      #unity-container { position: absolute; inset: 0; }
      /* The game is laid out for a portrait phone. Capping the canvas at 9:16 keeps that
         framing everywhere: a desktop window gets a centred phone-shaped column instead of
         a stretched one, while a portrait phone is narrower than the cap and so still
         fills the screen. */
      #unity-canvas {
        display: block;
        height: 100%;
        width: min(100%, calc(100vh * 0.5625));
        margin: 0 auto;
        background: #1b1d21;
      }
      #unity-loading-bar {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: 220px; display: block; font: 14px/1.4 system-ui, sans-serif; color: #cfd3d8;
        text-align: center;
      }
      #unity-progress-bar-empty { width: 100%; height: 8px; margin-top: 10px; background: #2b2f36; border-radius: 4px; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #4db6c4; border-radius: 4px; transition: width .1s linear; }
      #unity-warning { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        Match2Blast
        <div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        div.style = 'padding:10px; color:#111; background:' + (type == 'error' ? '#ff6b6b' : '#ffd93d');
        warningBanner.appendChild(div);
        if (type != 'error') setTimeout(function () { warningBanner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Match2Blast",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = (100 * progress) + "%";
        }).then(function () {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
